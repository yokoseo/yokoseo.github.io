<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アモール Yoko Rose - 与える愛タイプ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #FF6B6B, #FFE3E3);
            color: #333;
            line-height: 1.8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            color: #333;
        }

        .title {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #FF4757;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #666;
        }

        .content-section {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.8em;
            color: #FF4757;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #FF6B6B;
            padding-bottom: 10px;
        }

        .feature-list {
            list-style-type: none;
            padding: 0;
        }

        .feature-item {
            margin-bottom: 20px;
            padding: 15px;
            background-color: rgba(255, 107, 107, 0.1);
            border-radius: 10px;
            border-left: 4px solid #FF4757;
        }

        .feature-title {
            font-weight: bold;
            color: #FF4757;
            margin-bottom: 10px;
        }

        .feature-content {
            color: #666;
        }

        .action-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
        }

        .action-emoji {
            font-size: 1.5em;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }

        .action-text {
            flex: 1;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #FF4757;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        .back-link:hover {
            background-color: #FF6B6B;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 10px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .content-section {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="title">与える愛タイプ</h1>
            <p class="subtitle">🔥 愛の循環を学ぶ旅</p>
        </div>

        <div class="content-section">
            <h2 class="section-title">特徴</h2>
            <div class="feature-item">
                <div class="feature-content">
                    人に尽くすことに喜びを感じるが、自分を後回しにしやすい。
                </div>
            </div>
        </div>

        <div class="content-section">
            <h2 class="section-title">課題</h2>
            <div class="feature-item">
                <div class="feature-content">
                    「与えること＝愛」という思い込みから、自分の価値を他人に預けてしまう。
                </div>
            </div>
        </div>

        <div class="content-section">
            <h2 class="section-title">必要なマインドセット</h2>
            <div class="feature-item">
                <div class="feature-content">
                    「わたしも、受け取っていい」<br>
                    愛は流れ。自分にも向けて初めて"完全な循環"になる。
                </div>
            </div>
        </div>

        <div class="content-section">
            <h2 class="section-title">推奨アクション</h2>
            <div class="action-item">
                <div class="action-emoji">💝</div>
                <div class="action-text">毎日のセルフラブ習慣（鏡に向かって「ありがとう」と言うなど）</div>
            </div>
            <div class="action-item">
                <div class="action-emoji">🚫</div>
                <div class="action-text">「No」と言う練習（与えるばかりではなく、境界線を持つ）</div>
            </div>
            <div class="action-item">
                <div class="action-emoji">✨</div>
                <div class="action-text">自分のためにだけ1日を使う体験（小さな贅沢を許す）</div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="../content-ja.html" class="back-link">コンテンツ一覧に戻る</a>
        </div>
    </div>
</body>

</html>
